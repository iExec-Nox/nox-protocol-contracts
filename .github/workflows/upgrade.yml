name: Upgrade contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - tenderlyArbitrumSepolia
          - arbitrumSepolia
          - sepolia
        default: "tenderlyArbitrumSepolia"

jobs:
  pre-upgrade:
    uses: ./.github/workflows/main.yml

  upgrade:
    needs: pre-upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Upgrade contracts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: pnpm run upgrade:production --network ${{ inputs.network }}

      # Push artifacts to the current branch if it's not `main`.
      - name: Push artifacts to the current branch
        if: github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: ".openzeppelin/"
          commit_message: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"

      # If on `main` branch (protected) then create a PR to push artifacts.
      - name: Push artifacts through a pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ".openzeppelin/"
          commit-message: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          committer: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          branch: chore/save-upgrade-artifacts-${{ inputs.network }}-${{ github.run_id }}
          title: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          body: |
            🤖 This is an automated pull request created by `${{ github.workflow }}` GitHub Actions
            workflow to save upgrade artifacts.
            * Network: `${{ inputs.network }}`
            * Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Note**: Verify deployment before merging this PR.
          draft: true

      - name: Verify new implementation
        if: inputs.network != 'tenderlyArbitrumSepolia'
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: pnpm run verify ${{ inputs.network }} --network ${{ inputs.network }}
