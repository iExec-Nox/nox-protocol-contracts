name: Upgrade contracts

# Two upgrade paths depending on the target network:
#   - Testnets (tenderlyArbitrumSepolia, arbitrumSepolia, sepolia): the upgrade is executed
#     directly by the upgrader EOA via `pnpm run upgrade:production`.
#   - Ethereum mainnet: the `UPGRADER_ROLE` is held by a Safe multisig, so the upgrade is NOT
#     executed here. Instead the new implementation is deployed, the `upgradeToAndCall` calldata
#     is prepared, and the transaction is proposed to the Safe via the reusable
#     `propose-safe-multisig-tx` workflow for the signers to approve and execute.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - tenderlyArbitrumSepolia
          - arbitrumSepolia
          - sepolia
          - ethereum
        default: "tenderlyArbitrumSepolia"
      dry_run:
        description: "Ethereum only: prepare and validate the Safe transaction without proposing it"
        required: false
        type: boolean
        default: false

jobs:
  pre-upgrade:
    uses: ./.github/workflows/main.yml

  # ============ Testnet path: execute the upgrade directly ============
  upgrade:
    needs: pre-upgrade
    if: inputs.network != 'ethereum'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Upgrade contracts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.UPGRADER_PRIVATE_KEY }}
        run: pnpm run upgrade:production --network ${{ inputs.network }}

      # Push artifacts to the current branch if it's not `main`.
      - name: Push artifacts to the current branch
        if: github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: ".openzeppelin/"
          commit_message: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"

      # If on `main` branch (protected) then create a PR to push artifacts.
      - name: Push artifacts through a pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ".openzeppelin/"
          commit-message: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          committer: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          branch: chore/save-upgrade-artifacts-${{ inputs.network }}-${{ github.run_id }}
          title: "chore: save upgrade artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          body: |
            🤖 This is an automated pull request created by `${{ github.workflow }}` GitHub Actions
            workflow to save upgrade artifacts.
            * Network: `${{ inputs.network }}`
            * Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Note**: Verify deployment before merging this PR.
          draft: true

      - name: Verify new implementation
        if: inputs.network != 'tenderlyArbitrumSepolia'
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.UPGRADER_PRIVATE_KEY }}
        run: pnpm run verify ${{ inputs.network }} --network ${{ inputs.network }}

  # ============ Ethereum mainnet path: deploy implementation + prepare Safe calldata ============
  prepare-ethereum-upgrade:
    needs: pre-upgrade
    if: inputs.network == 'ethereum'
    runs-on: ubuntu-latest
    environment: ethereum
    permissions:
      contents: write
      pull-requests: write
    outputs:
      transaction-to: ${{ steps.prepare.outputs.transaction-to }}
      transaction-data: ${{ steps.prepare.outputs.transaction-data }}
      new-implementation: ${{ steps.prepare.outputs.new-implementation }}
      safe-address: ${{ vars.SAFE_ADDRESS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Prepare upgrade
        id: prepare
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.SAFE_PROPOSER_PRIVATE_KEY }}
        run: pnpm run prepare-upgrade:production --network ethereum

      - name: Push artifacts to the current branch
        if: github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: ".openzeppelin/"
          commit_message: "chore: save upgrade artifacts for ethereum (GitHub run id: ${{ github.run_id }})"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"

      - name: Push artifacts through a pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ".openzeppelin/"
          commit-message: "chore: save upgrade artifacts for ethereum (GitHub run id: ${{ github.run_id }})"
          committer: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          branch: chore/save-upgrade-artifacts-ethereum-${{ github.run_id }}
          title: "chore: save upgrade artifacts for ethereum (GitHub run id: ${{ github.run_id }})"
          body: |
            🤖 This is an automated pull request created by `${{ github.workflow }}` GitHub Actions
            workflow to save upgrade artifacts.
            * Network: `ethereum`
            * Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Note**: Verify deployment before merging this PR.
          draft: true

  propose-safe-tx:
    needs: prepare-ethereum-upgrade
    if: inputs.network == 'ethereum'
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/propose-safe-multisig-tx.yml@propose-safe-multisig-tx-v1.1.0
    with:
      safe-address: ${{ needs.prepare-ethereum-upgrade.outputs.safe-address }}
      transaction-to: ${{ needs.prepare-ethereum-upgrade.outputs.transaction-to }}
      transaction-data: ${{ needs.prepare-ethereum-upgrade.outputs.transaction-data }}
      dry-run: ${{ inputs.dry_run }}
    secrets:
      rpc-url: ${{ secrets.RPC_URL }}
      safe-proposer-private-key: ${{ secrets.SAFE_PROPOSER_PRIVATE_KEY }}
      safe-api-key: ${{ secrets.SAFE_API_KEY }}
