name: Set Gateway

on:
  workflow_run:
    workflows: ["Deploy contracts"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      network:
        description: "Network where contracts are deployed"
        required: true
        type: choice
        options:
          - arbitrumSepolia
          - tenderlyArbitrumSepolia
        default: "arbitrumSepolia"
      gateway_address:
        description: "Gateway wallet address to set"
        required: true
        type: string

jobs:
  set-gateway:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.inputs.network != 'hardhat')
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.network || github.event.workflow_run.inputs.network }}
    steps:
      - uses: actions/checkout@v5
        with:
          # For workflow_run, we need to checkout the branch that was deployed
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm run build

      - name: Determine network
        id: network
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "network=${{ inputs.network }}" >> $GITHUB_OUTPUT
          else
            echo "network=${{ github.event.workflow_run.inputs.network }}" >> $GITHUB_OUTPUT
          fi

      - name: Set gateway address
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          GATEWAY_ADDRESS: ${{ github.event_name == 'workflow_dispatch' && inputs.gateway_address || secrets.GATEWAY_ADDRESS }}
        run: pnpm run set-gateway --network ${{ steps.network.outputs.network }}
