name: Set Gateway

on:
  workflow_call:
    inputs:
      network:
        description: "Network where contracts are deployed"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      network:
        description: "Network where contracts are deployed"
        required: true
        type: choice
        options:
          - arbitrumSepolia
          - tenderlyArbitrumSepolia
        default: "arbitrumSepolia"
      gateway_address:
        description: "Gateway wallet address to set (uses secret if not provided)"
        required: false
        type: string

jobs:
  set-gateway:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm run build

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts-${{ inputs.network }}
          path: ignition/deployments/${{ inputs.network }}/

      - name: Set gateway address
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          GATEWAY_ADDRESS: ${{ inputs.gateway_address || secrets.GATEWAY_ADDRESS }}
        run: pnpm run set-gateway --network ${{ inputs.network }}
