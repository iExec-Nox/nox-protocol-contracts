name: Set Gateway

on:
  workflow_call:
    inputs:
      network:
        description: "Network where contracts are deployed"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      network:
        description: "Network where contracts are deployed"
        required: true
        type: choice
        options:
          - arbitrumSepolia
          - tenderlyArbitrumSepolia
          - sepolia
        default: "arbitrumSepolia"

jobs:
  set-gateway:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm run build

      # Download artifacts from deploy job (only needed when called from deploy workflow)
      - name: Download deployment artifacts
        if: github.workflow == 'Deploy contracts'
        uses: actions/download-artifact@v6
        with:
          name: deployment-artifacts-${{ inputs.network }}
          path: ignition/deployments/${{ inputs.network }}/

      - name: Set gateway address
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: pnpm run set-gateway --network ${{ inputs.network }}
