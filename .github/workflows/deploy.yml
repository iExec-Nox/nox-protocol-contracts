name: Deploy contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - hardhat
          - arbitrumSepolia
          - tenderlyArbitrumSepolia
          - sepolia
        default: "hardhat"
      reset-artifacts:
        description: "Reset Ignition deployment artifacts before deploying (required when contract bytecode changes)"
        required: false
        type: boolean
        default: false
      deploy-genesis:
        description: "Deploy the genesis version (tag v0.1.0) instead of current HEAD, to preserve the original proxy CREATE2 address"
        required: false
        type: boolean
        default: false

jobs:
  pre-deploy:
    uses: ./.github/workflows/main.yml

  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit artifacts.
      pull-requests: write # Required to create pull requests.
    environment: ${{ inputs.network }}
    env:
      GENESIS_TAG: v0.1.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy-genesis && env.GENESIS_TAG || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # v0.1.0 predates the sepolia network. The patch script injects a sepolia
      # entry into the checked-out hardhat.config.ts and config/config.ts so the
      # genesis deploy reproduces the original arbitrumSepolia CREATE2 address.
      # NOTE: the script lives on the current branch but is invoked while the
      # working tree is at the v0.1.0 tag; we run it through the dispatched ref's
      # version via the GitHub raw URL to avoid depending on what existed at v0.1.0.
      - name: Patch v0.1.0 source to support sepolia
        if: inputs.deploy-genesis && inputs.network == 'sepolia'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/patch-genesis-sepolia.mjs" \
            -o /tmp/patch-genesis-sepolia.mjs
          node /tmp/patch-genesis-sepolia.mjs

      - name: Deploy contracts on Hardhat (dry-run)
        if: inputs.network == 'hardhat'
        run: pnpm run deploy

      - name: Reset Ignition deployment artifacts
        if: inputs.network != 'hardhat' && inputs.reset-artifacts
        run: rm -rf ignition/deployments/${{ inputs.network }}

      - name: Deploy contracts
        if: inputs.network != 'hardhat'
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          # On a genesis sepolia deploy, force the KMS used at the original arbitrumSepolia
          # deploy so the CREATE2 proxy address matches `0xd464B198f06756a1d00be223634b85E0a731c229`.
          KMS_PUBLIC_KEY: ${{ (inputs.deploy-genesis && inputs.network == 'sepolia') && '0x02221f1baca89fd75ec26566b9c6003bc793b47affe171a7824279d973f54a2fd9' || vars.KMS_PUBLIC_KEY }}
        run: pnpm run deploy:production --network ${{ inputs.network }}

      # After a genesis deploy, the workspace is on a detached HEAD at the genesis tag.
      # Move freshly produced artifacts aside, re-checkout the dispatched ref so that
      # subsequent commit/PR steps target the right branch, then restore the artifacts.
      - name: Stash genesis artifacts
        if: inputs.network != 'hardhat' && inputs.deploy-genesis
        run: |
          mkdir -p /tmp/genesis-artifacts
          mv ignition/deployments/${{ inputs.network }} /tmp/genesis-artifacts/ignition-deployment

      - name: Re-checkout dispatched ref
        if: inputs.network != 'hardhat' && inputs.deploy-genesis
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Restore genesis artifacts
        if: inputs.network != 'hardhat' && inputs.deploy-genesis
        run: |
          mkdir -p ignition/deployments
          mv /tmp/genesis-artifacts/ignition-deployment ignition/deployments/${{ inputs.network }}

      # Used in set-gateway job.
      - name: Upload deployment artifacts
        if: inputs.network != 'hardhat'
        uses: actions/upload-artifact@v6
        with:
          name: deployment-artifacts-${{ inputs.network }}
          path: ignition/deployments/${{ inputs.network }}/
          retention-days: 1

      # Push artifacts to the current branch if it's not `main`.
      - name: Push artifacts to the current branch
        if: inputs.network != 'hardhat' && github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "ignition/deployments/"
          commit_message: "chore: save deployment artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"

      # If on `main` branch (protected) then create a PR to push artifacts.
      - name: Push artifacts through a pull request
        if: inputs.network != 'hardhat' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: "ignition/deployments/"
          commit-message: "chore: save deployment artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          committer: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
          branch: chore/save-deploy-artifacts-${{ inputs.network }}-${{ github.run_id }}
          title: "chore: save deployment artifacts for ${{ inputs.network }} (GitHub run id: ${{ github.run_id }})"
          body: |
            🤖 This is an automated pull request created by `${{ github.workflow }}` GitHub Actions
            workflow to save deployment artifacts.
            * Network: `${{ inputs.network }}`
            * Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Note**: Verify deployment before merging this PR.
          draft: true

      - name: Verify contracts
        if: inputs.network != 'hardhat' && inputs.network != 'tenderlyArbitrumSepolia'
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: pnpm run verify ${{ inputs.network }} --network ${{ inputs.network }}

  set-gateway:
    needs: deploy
    if: inputs.network != 'hardhat'
    uses: ./.github/workflows/set-gateway.yml
    with:
      network: ${{ inputs.network }}
    secrets: inherit
