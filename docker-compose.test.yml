# Local test stack for nox-protocol-contracts.
#
# Prerequisites:
#   - A running hardhat node on port 8545:
#       npx hardhat node --port 8545
#   - The following env vars set (managed by OffChainServices.start()):
#       NOX_COMPUTE_CONTRACT   deployed NoxCompute proxy address
#       NOX_CHAIN_ID           chain ID (default: 31337)
#       NOX_RPC_URL            hardhat node RPC URL accessible by containers
#       NOX_GATEWAY_ADDRESS    gateway signer address (for contract registration)
#       NOX_KMS_SIGNER_ADDRESS KMS signer address (for gateway verification)
#       NOX_KMS_VERSION        nox-kms image version
#       NOX_HANDLE_GATEWAY_VERSION  nox-handle-gateway image version
#       NOX_INGESTOR_VERSION   nox-ingestor image version
#       NOX_RUNNER_VERSION     nox-runner image version

networks:
  nox-off-chain:
    name: nox-off-chain

services:
  # ============ PostgreSQL (gateway database) ============

  nox-handle-gateway-db:
    image: postgres:18-alpine
    container_name: nox-handle-gateway-db-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nox_gateway_test
    volumes:
      - ./test/fixtures/pg:/docker-entrypoint-initdb.d
    networks:
      - nox-off-chain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nox_gateway_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # ============ KMS ============

  nox-kms:
    image: docker-regis.iex.ec/nox-kms:${NOX_KMS_VERSION:-latest}
    container_name: nox-kms-test
    environment:
      - NOX_KMS_CHAIN__CHAIN_ID=${NOX_CHAIN_ID:-31337}
      - NOX_KMS_CHAIN__RPC_URL=${NOX_RPC_URL:-http://host.docker.internal:8545}
      - NOX_KMS_CHAIN__NOX_COMPUTE_CONTRACT=${NOX_COMPUTE_CONTRACT}
      - NOX_KMS_KEY_FILENAME=/data/kms.key
      - NOX_KMS_KEYSTORE_FILENAME=/data/keystore_signer.json
      - NOX_KMS_KEYSTORE_PASSWORD=
      - RUST_LOG=${NOX_KMS_RUST_LOG:-info}
    volumes:
      - ./test/fixtures/keys/kms:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nox-off-chain
    ports:
      - "9204:9000"

  # ============ Handle Gateway ============

  nox-handle-gateway:
    image: docker-regis.iex.ec/nox-handle-gateway:${NOX_HANDLE_GATEWAY_VERSION:-latest}
    container_name: nox-handle-gateway-test
    environment:
      - NOX_HANDLE_GATEWAY_CHAIN__ID=${NOX_CHAIN_ID:-31337}
      - NOX_HANDLE_GATEWAY_CHAIN__RPC_URL=${NOX_RPC_URL:-http://host.docker.internal:8545}
      - NOX_HANDLE_GATEWAY_CHAIN__NOX_COMPUTE_CONTRACT=${NOX_COMPUTE_CONTRACT}
      - NOX_HANDLE_GATEWAY_KMS__URL=http://nox-kms-test:9000
      - NOX_HANDLE_GATEWAY_KMS__SIGNER_ADDRESS=${NOX_KMS_SIGNER_ADDRESS}
      - NOX_HANDLE_GATEWAY_SIGNER__KEYSTORE_FILENAME=/data/gateway_keystore.json
      - NOX_HANDLE_GATEWAY_SIGNER__KEYSTORE_PASSWORD=
      - NOX_HANDLE_GATEWAY_SERVER__BACKEND_URL=postgresql://postgres:postgres@nox-handle-gateway-db-test:5432/nox_gateway_test
      - RUST_LOG=${NOX_HANDLE_GATEWAY_RUST_LOG:-info}
    volumes:
      - ./test/fixtures/keys/gateway:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nox-off-chain
    ports:
      - "9203:3000"
    depends_on:
      nox-handle-gateway-db:
        condition: service_healthy
      nox-kms:
        condition: service_started

  # ============ NATS message broker ============

  nats:
    image: nats:2.12-alpine
    container_name: nats-test
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "-m", "8222"]
    networks:
      - nox-off-chain
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ============ Ingestor (blockchain event watcher) ============

  nox-ingestor:
    image: docker-regis.iex.ec/nox-ingestor:${NOX_INGESTOR_VERSION:-latest}
    container_name: nox-ingestor-test
    environment:
      - NOX_INGESTOR_CHAIN__CHAIN_ID=${NOX_CHAIN_ID:-31337}
      - NOX_INGESTOR_CHAIN__RPC_ENDPOINT=${NOX_RPC_URL:-http://host.docker.internal:8545}
      - NOX_INGESTOR_CHAIN__CONTRACT_ADDRESS=${NOX_COMPUTE_CONTRACT}
      - NOX_INGESTOR_CHAIN__INITIAL_BLOCK=${NOX_INITIAL_BLOCK:-0}
      - NOX_INGESTOR_CHAIN__POLL_DELAY=200ms
      - NOX_INGESTOR_APP__STATE_PATH=/tmp/nox_ingestor_state.json
      - NOX_INGESTOR_NATS__URL=nats://nats-test:4222
      - RUST_LOG=${NOX_INGESTOR_RUST_LOG:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nox-off-chain
    depends_on:
      nats:
        condition: service_healthy

  # ============ Runner (TEE compute processor) ============

  nox-runner:
    image: docker-regis.iex.ec/nox-runner:${NOX_RUNNER_VERSION:-latest}
    container_name: nox-runner-test
    environment:
      - NOX_RUNNER_RPC_URL=${NOX_RPC_URL:-http://host.docker.internal:8545}
      - NOX_RUNNER_NOX_COMPUTE_CONTRACT_ADDRESS=${NOX_COMPUTE_CONTRACT}
      - NOX_RUNNER_HANDLE_GATEWAY_URL=http://nox-handle-gateway-test:3000
      - NOX_RUNNER_KMS_URL=http://nox-kms-test:9000
      - NOX_RUNNER_NATS_URL=nats://nats-test:4222
      - RUST_LOG=${NOX_RUNNER_RUST_LOG:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nox-off-chain
    depends_on:
      nats:
        condition: service_healthy
      nox-handle-gateway:
        condition: service_started
